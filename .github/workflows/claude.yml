name: Claude
on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude') || contains(github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Issue opened/assigned: implement the change and open a pull request.
      - if: github.event_name == 'issues'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Address issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            Run `gh issue view ${{ github.event.issue.number }}` to read the full request.
            Implement the change on a new branch, commit and push it, then open a
            pull request against the default branch whose body contains
            "Closes #${{ github.event.issue.number }}". Finish by commenting the
            pull request URL on the issue.
          claude_args: |
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep"

      # Comment or review mention: default interactive behavior.
      - if: github.event_name != 'issues'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
